name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Releases ship for all three, so the tests run on all three. Letting the
    # others finish when one fails shows whether a failure belongs to one
    # platform or to every platform.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Git for Windows checks text files out with CRLF line endings by
      # default. Tests that read the repository's own files expect the bytes
      # that were committed, so the checkout has to leave them alone.
      - name: keep line endings as committed
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          # Track the toolchain the module declares, so CI cannot drift from
          # what the code is developed against.
          go-version-file: go.mod
          cache: true

      # Formatting is the same everywhere, and Linux is the one checkout that
      # can be trusted to hold the committed bytes, so it is checked once there.
      - name: gofmt
        if: runner.os == 'Linux'
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # -race is the point of this step. The editor runs its event loop with a
      # single consumer goroutine by design, and that invariant is what lets
      # keymap, the kill ring and the Lua interpreter stay lock-free. A data
      # race here means that invariant has been broken.
      - name: test
        run: go test ./... -race -count=1

      - name: build
        run: go build ./...

  stress:
    name: random keys
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # The random-key tests make a few hundred keystrokes in every test run;
      # here they make hundreds of thousands, which is how the bugs they were
      # written for were found. Each run starts from new seeds, so CI keeps
      # looking further rather than repeating itself; a failure names its
      # seed, and NEM_STRESS_SEED runs it again.
      - name: random keys, at length
        env:
          NEM_STRESS_SEEDS: 150
          NEM_STRESS_STEPS: 1500
        run: |
          export NEM_STRESS_SEED=$(( GITHUB_RUN_NUMBER * 1000 ))
          echo "seeds from $NEM_STRESS_SEED"
          go test ./editor -run 'TestRandomKeys' -count=1 -timeout 30m

  cross:
    name: cross-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # nem is cgo-free on purpose, so every target builds from one runner.
      # This job exists to keep it that way: a dependency that pulls in cgo
      # would break here rather than at release time.
      - name: build every release target, statically
        run: |
          set -e
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 \
                        windows/amd64 windows/arm64; do
            os=${target%/*}; arch=${target#*/}
            echo "building $target"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -o /dev/null ./cmd/nem
          done
