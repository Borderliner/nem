name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Never publish a binary that does not pass its own tests. The release is
      # gated on this deliberately: a tag is public and hard to take back.
      - name: test
        run: go test ./... -race -count=1

      - name: build
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -e
          mkdir -p dist
          # nem is cgo-free, so every platform builds from this one runner and
          # every binary is fully static - no libc, no glibc version skew, runs
          # on musl and Alpine. CGO_ENABLED=0 is what guarantees that: Go turns
          # cgo on by default when a C compiler is present, and a Lip Gloss
          # dependency pulls in os/user, which links libc for NSS lookups.
          for target in \
              linux/amd64 linux/arm64 \
              darwin/amd64 darwin/arm64 \
              windows/amd64 windows/arm64; do
            os=${target%/*}; arch=${target#*/}
            name="nem_${VERSION}_${os}_${arch}"
            out="dist/$name"
            mkdir -p "$out"

            bin="$out/nem"
            [ "$os" = windows ] && bin="$out/nem.exe"

            # -trimpath keeps build paths out of the binary; -s -w drop the
            # symbol table and DWARF, which is 7.4MB -> 5.1MB, a third of it.
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build \
              -trimpath \
              -ldflags "-s -w -X main.version=${VERSION}" \
              -o "$bin" ./cmd/nem

            # Only what a user needs. docs/design is the project's own design
            # history and is noise in a release tarball.
            cp README.md "$out/"
            cp docs/config.md "$out/"
            cp examples/init.lua "$out/init.lua.example"

            # zip for Windows because it is what people expect there, but a
            # missing tool must not fail a release - modern Windows ships tar.
            if [ "$os" = windows ] && command -v zip >/dev/null; then
              (cd dist && zip -qr "${name}.zip" "$name")
            else
              tar -czf "${out}.tar.gz" -C dist "$name"
            fi
            rm -rf "$out"
          done
          cd dist && sha256sum * > checksums.txt && ls -la

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          gh release create "$VERSION" \
            --title "nem $VERSION" \
            --generate-notes \
            dist/*.tar.gz dist/*.zip dist/checksums.txt
